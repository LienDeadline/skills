name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Skill, layout and manifest rules
        run: node scripts/validate.mjs

  live:
    # Weekly and on demand only: pull requests must not depend on the website or npm.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Website copy and pinned MCP release
        run: node scripts/check-live.mjs
